<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bot Wars</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0d12;
        color: #e6e6e6;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      /* Shared layout variables. --game-aspect is set inline below; the rest
         live here so they can be tweaked in one place. The env() values resolve
         to 0px on devices without notch/home-indicator safe areas. */
      :root {
        --panel-min: 120px;
        --sab: env(safe-area-inset-bottom, 0px);
        --sat: env(safe-area-inset-top, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
        /* Available viewport after safe areas. 100dvh follows the dynamic
           viewport so the canvas/panel auto-resize when mobile browser chrome
           (URL bar) appears or hides. */
        --avh: calc(100dvh - var(--sab) - var(--sat));
        --avw: calc(100vw - var(--sal) - var(--sar));
        /* Natural letterbox dead-space — horizontal if the viewport is wider
           than the game's aspect, vertical otherwise. Clamped at 0. */
        --hdead: max(0px, calc(var(--avw) - var(--avh) * var(--game-aspect, 1.6516)));
        --vdead: max(0px, calc(var(--avh) - var(--avw) / var(--game-aspect, 1.6516)));
        /* Panel uses the natural dead space when ample, otherwise the minimum.
           When the min is taken, the canvas naturally shrinks to fit the
           remaining space via Phaser's FIT scaler. */
        --hpanel: max(var(--panel-min), var(--hdead));
        --vpanel: max(var(--panel-min), var(--vdead));
      }

      #game {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Fallback for browsers without 100dvh (pre-2022 mobile Safari/Chrome). */
        width: 100vw;
        height: calc(100vh - var(--sab));
        height: var(--avh);
        touch-action: none;
      }
      canvas {
        image-rendering: auto;
        touch-action: none;
      }

      /* Tooltip panel — hidden by default; positioned per the active mobile
         media query (side panel for phones, bottom panel for tablets). */
      #mobile-tooltip-panel {
        display: none;
        position: fixed;
        background: #0b0d12;
        box-sizing: border-box;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        z-index: 10;
        pointer-events: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        text-align: center;
      }

      /* Tablet landscape (or any landscape viewport narrower than the game's
         1024:620 aspect): tooltip goes BELOW the canvas. Listed first so the
         phone rule below wins at the exact-aspect boundary. */
      @media (pointer: coarse) and (orientation: landscape) and (max-aspect-ratio: 1024/620) {
        #mobile-tooltip-panel {
          display: flex;
          left: 0;
          right: 0;
          bottom: 0;
          width: 100vw;
          height: var(--vpanel);
          padding: 8px max(6px, var(--sar)) max(8px, var(--sab)) max(6px, var(--sal));
          border-top: 1px solid #1e2633;
        }
        #game {
          inset: var(--sat) var(--sar) calc(var(--sab) + var(--vpanel)) var(--sal);
          width: auto;
          height: auto;
        }
      }

      /* Phone landscape (or any landscape viewport wider than the game's
         1024:620 aspect): tooltip goes on the LEFT of the canvas. */
      @media (pointer: coarse) and (orientation: landscape) and (min-aspect-ratio: 1024/620) {
        #mobile-tooltip-panel {
          display: flex;
          top: 0;
          bottom: 0;
          left: 0;
          width: var(--hpanel);
          padding: max(10px, var(--sat)) 6px max(10px, var(--sab)) max(6px, var(--sal));
          border-right: 1px solid #1e2633;
        }
        #game {
          inset: var(--sat) var(--sar) var(--sab) var(--hpanel);
          width: auto;
          height: auto;
        }
      }
      .mtp-title {
        color: #cfdbe5;
        font-size: 14px;
        font-weight: bold;
        line-height: 1.3;
        word-break: break-word;
      }
      .mtp-body {
        color: #7a9ab0;
        font-size: 12px;
        line-height: 1.45;
        word-break: break-word;
      }
      .mtp-hint {
        color: #2a3848;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        line-height: 1.8;
      }

      /* Portrait-mode overlay: shown via CSS, no JS needed */
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #0b0d12;
        z-index: 99999;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 24px;
      }
      .rotate-icon {
        font-size: 64px;
        animation: rotate-hint 2s ease-in-out infinite;
      }
      .rotate-text {
        font-size: 18px;
        color: #9fb3c4;
        letter-spacing: 2px;
        text-align: center;
        padding: 0 20px;
      }
      @keyframes rotate-hint {
        0%   { transform: rotate(-90deg); }
        50%  { transform: rotate(0deg); }
        100% { transform: rotate(-90deg); }
      }
      /* Show the overlay only in portrait (width ≤ height) */
      @media (max-aspect-ratio: 1/1) {
        #rotate-overlay { display: flex; }
      }

      #preloader {
        position: fixed;
        inset: 0;
        background: #0b0d12;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
        overflow: hidden;
      }
      #preloader.hidden { opacity: 0; pointer-events: none; }
      .pl-stack {
        display: flex;
        flex-direction: column;
        gap: 24px;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 10;
        padding: 40px;
        box-sizing: border-box;
      }
      .pl-title {
        font-size: clamp(32px, 12vw, 84px);
        font-weight: 900;
        letter-spacing: clamp(8px, 3vw, 24px);
        color: #ffffff;
        text-shadow: 0 0 30px rgba(74, 143, 255, 0.5);
        text-align: center;
        margin-right: -24px; /* Offset for letter-spacing centering */
      }
      .pl-bar {
        position: absolute;
        inset: 0;
        background: #0b0d12;
        z-index: 0;
        overflow: hidden;
      }
      .pl-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(90deg, #0d1117 0%, #1e3a8a 100%);
        border-right: 4px solid #4a8fff;
        transition: width 0.3s ease-out;
      }
      .pl-fill.indeterminate {
        width: 100%;
        background: linear-gradient(90deg, transparent 0%, rgba(74, 143, 255, 0.1) 50%, transparent 100%);
        background-size: 200% 100%;
        background-repeat: no-repeat;
        animation: pl-sweep 2s linear infinite;
        border-right: none;
      }
      @keyframes pl-sweep {
        0%   { background-position: -100% 0; }
        100% { background-position: 100% 0; }
      }
      .pl-status {
        font-size: clamp(14px, 5vw, 22px);
        color: #94a3b8;
        min-height: 1.5em;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: 600;
        text-align: center;
        opacity: 0.8;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CFJRtW0Q.js"></script>
  </head>
  <body>
    <script>document.documentElement.style.setProperty('--game-aspect', String(1024 / 620));</script>
    <div id="mobile-tooltip-panel"><div class="mtp-hint">HOLD TO<br>INSPECT</div></div>
    <div id="rotate-overlay">
      <div class="rotate-icon">⟳</div>
      <div class="rotate-text">Rotate your device to landscape</div>
    </div>
    <div id="preloader">
      <div class="pl-stack">
        <div class="pl-title">BOT WARS</div>
        <div class="pl-bar"><div class="pl-fill indeterminate" id="pl-fill"></div></div>
        <div class="pl-status" id="pl-status">Loading game engine…</div>
      </div>
    </div>
    <div id="game"></div>
  </body>
</html>
