<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bot Wars</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0d12;
        color: #e6e6e6;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #game {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      canvas {
        image-rendering: auto;
        touch-action: none;
      }

      /* Left-side tooltip panel — hidden by default, shown via media query below */
      #mobile-tooltip-panel {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        /* width = dead space = viewport_width - canvas_width (canvas_width = vh * game_aspect) */
        width: calc(100vw - 100vh * var(--game-aspect, 1.6516));
        height: 100vh;
        background: #0b0d12;
        border-right: 1px solid #1e2633;
        box-sizing: border-box;
        padding: 10px 6px;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        z-index: 10;
        pointer-events: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        text-align: center;
      }

      /* Phone landscape: touch device + short viewport (phone, not tablet) + wider than game */
      @media (pointer: coarse) and (max-height: 499px) and (min-aspect-ratio: 1025/620) {
        /* Phaser centers the canvas: marginLeft = deadSpace/2.
           translateX(deadSpace/2) shifts it right by the same amount → flush right. */
        canvas {
          transform: translateX(calc((100vw - 100vh * var(--game-aspect)) / 2));
        }
        #mobile-tooltip-panel {
          display: flex;
        }
      }
      .mtp-title {
        color: #cfdbe5;
        font-size: 14px;
        font-weight: bold;
        line-height: 1.3;
        word-break: break-word;
      }
      .mtp-body {
        color: #7a9ab0;
        font-size: 12px;
        line-height: 1.45;
        word-break: break-word;
      }
      .mtp-hint {
        color: #2a3848;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        line-height: 1.8;
      }

      /* Portrait-mode overlay: shown via CSS, no JS needed */
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #0b0d12;
        z-index: 99999;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 24px;
      }
      .rotate-icon {
        font-size: 64px;
        animation: rotate-hint 2s ease-in-out infinite;
      }
      .rotate-text {
        font-size: 18px;
        color: #9fb3c4;
        letter-spacing: 2px;
        text-align: center;
        padding: 0 20px;
      }
      @keyframes rotate-hint {
        0%   { transform: rotate(-90deg); }
        50%  { transform: rotate(0deg); }
        100% { transform: rotate(-90deg); }
      }
      /* Show the overlay only in portrait (width ≤ height) */
      @media (max-aspect-ratio: 1/1) {
        #rotate-overlay { display: flex; }
      }

      #preloader {
        position: fixed;
        inset: 0;
        background: #0b0d12;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
        overflow: hidden;
      }
      #preloader.hidden { opacity: 0; pointer-events: none; }
      .pl-stack {
        display: flex;
        flex-direction: column;
        gap: 24px;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 10;
        padding: 40px;
        box-sizing: border-box;
      }
      .pl-title {
        font-size: clamp(32px, 12vw, 84px);
        font-weight: 900;
        letter-spacing: clamp(8px, 3vw, 24px);
        color: #ffffff;
        text-shadow: 0 0 30px rgba(74, 143, 255, 0.5);
        text-align: center;
        margin-right: -24px; /* Offset for letter-spacing centering */
      }
      .pl-bar {
        position: absolute;
        inset: 0;
        background: #0b0d12;
        z-index: 0;
        overflow: hidden;
      }
      .pl-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(90deg, #0d1117 0%, #1e3a8a 100%);
        border-right: 4px solid #4a8fff;
        transition: width 0.3s ease-out;
      }
      .pl-fill.indeterminate {
        width: 100%;
        background: linear-gradient(90deg, transparent 0%, rgba(74, 143, 255, 0.1) 50%, transparent 100%);
        background-size: 200% 100%;
        background-repeat: no-repeat;
        animation: pl-sweep 2s linear infinite;
        border-right: none;
      }
      @keyframes pl-sweep {
        0%   { background-position: -100% 0; }
        100% { background-position: 100% 0; }
      }
      .pl-status {
        font-size: clamp(14px, 5vw, 22px);
        color: #94a3b8;
        min-height: 1.5em;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: 600;
        text-align: center;
        opacity: 0.8;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-B5bLzGQE.js"></script>
  </head>
  <body>
    <script>document.documentElement.style.setProperty('--game-aspect', String(1024 / 620));</script>
    <div id="mobile-tooltip-panel"><div class="mtp-hint">HOLD TO<br>INSPECT</div></div>
    <div id="rotate-overlay">
      <div class="rotate-icon">⟳</div>
      <div class="rotate-text">Rotate your device to landscape</div>
    </div>
    <div id="preloader">
      <div class="pl-stack">
        <div class="pl-title">BOT WARS</div>
        <div class="pl-bar"><div class="pl-fill indeterminate" id="pl-fill"></div></div>
        <div class="pl-status" id="pl-status">Loading game engine…</div>
      </div>
    </div>
    <div id="game"></div>
  </body>
</html>
