<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bot Wars</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0d12;
        color: #e6e6e6;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #game {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
      }
      canvas { image-rendering: auto; }

      #preloader {
        position: fixed;
        inset: 0;
        background: #0b0d12;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.35s ease;
      }
      #preloader.hidden { opacity: 0; pointer-events: none; }
      .pl-stack {
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
        min-width: 360px;
      }
      .pl-title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 6px;
        color: #e6e6e6;
      }
      .pl-bar {
        width: 360px;
        height: 10px;
        background: #1a1d26;
        border: 1px solid #2a2f3d;
        border-radius: 5px;
        overflow: hidden;
        position: relative;
      }
      .pl-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(90deg, #4a8fff, #6aa8ff);
        transition: width 0.15s ease-out;
      }
      .pl-fill.indeterminate {
        width: 100%;
        background: linear-gradient(90deg, transparent 0%, #4a8fff 50%, transparent 100%);
        background-size: 35% 100%;
        background-repeat: no-repeat;
        animation: pl-sweep 1.3s ease-in-out infinite;
      }
      @keyframes pl-sweep {
        0%   { background-position: -35% 0; }
        100% { background-position: 135% 0; }
      }
      .pl-status {
        font-size: 12px;
        color: #8a90a0;
        min-height: 1em;
        letter-spacing: 1px;
      }
    </style>
    <script type="module" crossorigin src="/bot-wars-deployment/assets/index-CIqQv2qx.js"></script>
  </head>
  <body>
    <div id="preloader">
      <div class="pl-stack">
        <div class="pl-title">BOT WARS</div>
        <div class="pl-bar"><div class="pl-fill indeterminate" id="pl-fill"></div></div>
        <div class="pl-status" id="pl-status">Loading game engine…</div>
      </div>
    </div>
    <div id="game"></div>
  </body>
</html>
